org.gradle.jvmargs=-Xmx1G
org.gradle.caching=true
org.gradle.configuration-cache=false

version=0.1.1

# Hytale target
# Server API version to compile against (com.hypixel.hytale:Server on maven.hytale.com).
# Maven only keeps the last ~5 versions, so bump this together with the installed game.
hytale_version=0.7.0
# Patchline of the locally installed game used by runServer/deployClient.
hytale_patchline=release
# Optional: override the Hytale install root (defaults to %APPDATA%/Hytale on Windows, ~/.hytale elsewhere).
#hytale_home=C:/Users/you/AppData/Roaming/Hytale

# Plugin metadata (expanded into manifest.json)
plugin_group=YamiKhal
plugin_description=Host your world for friends without port forwarding.
plugin_author=YamiKhal
plugin_website=https://e4h.yamikhal.com
plugin_main_entrypoint=com.yamikhal.e4hytale.E4Hytale
# SemverRange of supported server versions.
server_version=>=0.7.0
